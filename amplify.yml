version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== MEMORESSE BRAND GUIDEBOOK BUILD ==="
        - echo "Current directory: $(pwd)"
        - echo "Node version: $(node --version)"
        - echo "NPM version: $(npm --version)"
        - echo "--- Installing dependencies ---"
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "=== BUILDING ASTRO BRAND GUIDEBOOK ==="
        - echo "--- Clean previous builds ---"
        - rm -rf dist
        - echo "--- Building Astro static site ---"
        - npm run build
        - echo "--- Verify build output ---"
        - |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not created!"
            ls -la . || echo "No files in root"
            exit 1
          fi
        - echo "--- Verify assets ---"
        - ls -la dist/
        - |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: index.html not found!"
            exit 1
          fi
        - echo "--- Build completed successfully ---"
        - echo "Brand guidebook ready for deployment!"
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
  customHeaders:
    - pattern: '/assets/**'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '/_astro/**'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.woff2'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.png'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=2592000'
    - pattern: '**/*.jpg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=2592000'
    - pattern: '**/*.svg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=2592000'

