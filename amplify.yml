version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== MEMORESSE BRAND GUIDEBOOK BUILD ==="
        - nvm use 20
        - echo "Node version check"
        - node --version
        - npm --version
        - echo "Installing dependencies"
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - echo "=== BUILDING ASTRO BRAND GUIDEBOOK ==="
        - npm run build
        - echo "Build completed"
        - ls -la dist/
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
  customHeaders:
    - pattern: '/assets/**'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '/_astro/**'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '**/*.png'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=2592000'
    - pattern: '**/*.jpg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=2592000'
    - pattern: '**/*.svg'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=2592000'