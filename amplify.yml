version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build:amplify
        - echo "Build completed - checking output:"
        - ls -la .amplify-hosting/
        - ls -la .amplify-hosting/static/
  artifacts:
    baseDirectory: .amplify-hosting/static
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*